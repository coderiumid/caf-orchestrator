# Structural (non-secret) config. Copy to caf.config.yaml and edit.
# Secrets and operational toggles stay in .env — see .env.example.

server:
  port: 3000

linear:
  apiUrl: https://api.linear.app/graphql
  # UUID of the workflow state that triggers the pipeline (e.g. "Ready for AI").
  # Required — startup fails fast if missing.
  readyStateId: 00000000-0000-0000-0000-000000000000
  webhookTimestampToleranceMs: 60000
  deliveryDedupeTtlSeconds: 86400

github:
  apiUrl: https://api.github.com
  deliveryDedupeTtlSeconds: 86400
  # Label that transitions a GitHub Issue into "Ready for AI" and triggers
  # the full agent pipeline — the GitHub analog of linear.readyStateId.
  # Attach it on GitHub via the `issues` webhook event (action: labeled).
  readyLabel: ready-for-ai

# Claude Code agent spawning
claude:
  command: claude
  agentTimeoutMs: 1800000

workspace:
  dir: /tmp/caf-orchestrator/workspace
  # 'ephemeral' (default): every job clones the target repo to a fresh
  # job-<uuid> dir and removes it after — no config changes needed, this is
  # the pre-existing behavior. Use this unless you have a specific reason
  # not to.
  # 'persistent': a ticket-pipeline job reuses a per-repo
  # `persistent-<repoName>` subfolder under workspace.dir across runs
  # (fetch + reset instead of a fresh clone). Use only for large repos where
  # a full clone per job is genuinely expensive — it adds real operational
  # risk (destructive `git reset --hard`/`clean -fd` on every reuse; a
  # second job for the same repo is rejected outright, not queued, while the
  # first still holds the workspace).
  # Applies ONLY to the ticket pipeline. PR-review jobs always clone fresh
  # into an ephemeral dir and clean up after, regardless of this setting —
  # they never reuse or lock a persistent workspace.
  # The destructive reset/clean here only ever runs inside this
  # orchestrator's own scratch dir (workspace.dir), never a human's working
  # directory — see design.md for the full audit-trail/locking mechanics.
  mode: ephemeral

# Per-project registry — every ticket-triggering project must be listed here.
# Key is a project name of your choosing; ticketPrefix is what the registry
# keys on (must match the Linear ticket key prefix, e.g. "ABC" for ABC-123).
projects:
  your-project:
    ticketPrefix: ABC
    repoCloneUrl: https://github.com/your-org/your-repo.git
    baseBranch: main
    workspaceDir: /tmp/caf-orchestrator/workspace/your-project
    agents:
      modelOverrides: {}

queue:
  jobTtlSeconds: 86400
  maxJobsRetained: 100
  # BullMQ job-level retry (full pipeline re-run from clone, no step-resume).
  jobAttempts: 2
  backoffDelayMs: 10000
  # Concurrent Claude Code agent processes per worker.
  workerConcurrency: 1

agents:
  # Pipeline gate retries: how many times to re-run implementation agents
  # after a QA FAIL / reviewer CHANGES_REQUESTED before stopping for human review.
  qa:
    maxRetries: 1
  reviewer:
    maxRetries: 1
  # Per-agent model override, e.g. { caf-qa: "ag/gemini-3.5-flash-low" }.
  # Applied on top of openai.defaultModel — a per-agent entry wins over the
  # global default when both are set for the same run. Keys must be one of
  # caf-planner/caf-frontend/caf-backend/caf-qa/caf-reviewer/caf-documentation;
  # values must be an exact entry in openai.allowedModels (below).
  modelOverrides: {}

# Opt-in routing of spawned Claude Code agents through OpenRouter's
# Anthropic-compatible endpoint (failover + budget visibility). Off by
# default; if useOpenai is true, OPENAI_API_KEY (.env) becomes required.
openai:
  useOpenai: false
  baseUrl: https://openrouter.ai/api
  # Optional model override (maps to ANTHROPIC_DEFAULT_SONNET_MODEL in the
  # spawned claude process). Unset = claude CLI's own default model.
  # defaultModel: ag/claude-sonnet-4-6
  #
  # Exact model ids allowed to be sent to the claude CLI (openai.defaultModel
  # and every value in agents.modelOverrides above are checked against this
  # list, byte-for-byte — not a prefix match). Empty by default: fail-closed,
  # no model passes until you list it here. Each entry must be a model you
  # have personally verified actually works against openai.baseUrl (a model
  # id can look plausible and still 404 at call time if it doesn't exist on
  # the endpoint — startup validation only catches typos/unlisted ids, not
  # nonexistent ones). To add a model, verify it runs, then uncomment/add a
  # line like:
  #   - ag/gemini-3.5-flash-low
  allowedModels: []

# Bull Board queue dashboard at /admin/queues, basic-auth gated. Off by default
# (fail-safe). If enabled, DASHBOARD_BASIC_AUTH_PASSWORD must be set in .env.
dashboard:
  enabled: false
  # basicAuthUser: admin
